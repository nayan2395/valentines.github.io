<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Be My Valentine? 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --rose: #ff6b9d;
            --deep-rose: #c44569;
            --blush: #ffeef4;
            --cream: #fff5f7;
            --gold: #ffd700;
            --shadow: rgba(196, 69, 105, 0.2);
        }

        body {
            font-family: 'Crimson Text', serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--cream) 0%, var(--blush) 50%, #ffe0eb 100%);
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }

        /* Floating hearts background */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .heart-float {
            position: absolute;
            font-size: 20px;
            opacity: 0;
            animation: float-up 8s infinite ease-in;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            box-shadow: 0 20px 60px var(--shadow);
            max-width: 600px;
            width: 90%;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            animation: fade-in 1s ease-out;
            margin: 20px;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .emoji {
            font-size: 100px;
            animation: bounce 2s infinite;
            display: inline-block;
            margin-bottom: 20px;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.1);
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--deep-rose);
            margin-bottom: 20px;
            line-height: 1.2;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.4rem;
            color: #666;
            margin-bottom: 50px;
            font-style: italic;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
            position: relative;
            min-height: 180px;
            flex-wrap: wrap;
        }

        button {
            font-family: 'Crimson Text', serif;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 20px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 8px 20px var(--shadow);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-width: 160px;
        }

        .yes-btn {
            background: linear-gradient(135deg, var(--rose) 0%, var(--deep-rose) 100%);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .yes-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .yes-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .yes-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 30px var(--shadow);
        }

        .no-btn {
            background: white;
            color: var(--deep-rose);
            border: 3px solid var(--rose);
            position: relative;
            transition: all 0.15s ease-out;
        }
        
        .no-btn.moving {
            position: absolute;
        }

        .no-btn:hover {
            background: var(--blush);
        }

        /* Success message */
        .success {
            display: none;
            animation: celebrate 1s ease-out;
        }

        @keyframes celebrate {
            0% {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.2) rotate(10deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .success h2 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--deep-rose);
            margin-bottom: 20px;
        }

        .success p {
            font-size: 1.5rem;
            color: #666;
            line-height: 1.8;
        }

        .firework {
            position: fixed;
            width: 4px;
            height: 4px;
            background: var(--rose);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 2.2rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
                margin-bottom: 30px;
            }
            
            .emoji {
                font-size: 80px;
            }

            button {
                font-size: 1.2rem;
                padding: 18px 40px;
                min-width: 140px;
            }

            .container {
                padding: 40px 20px;
                width: 95%;
                margin: 10px;
            }

            .buttons {
                min-height: 200px;
                gap: 15px;
            }

            .success h2 {
                font-size: 2.2rem;
            }

            .success p {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 400px) {
            h1 {
                font-size: 1.9rem;
            }

            .subtitle {
                font-size: 1.1rem;
            }

            button {
                font-size: 1.1rem;
                padding: 16px 35px;
                letter-spacing: 1px;
            }

            .container {
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="hearts-bg" id="heartsContainer"></div>
    
    <div class="container">
        <div id="question">
            <div class="emoji">💝</div>
            <h1>Will You Be My Valentine?</h1>
            <p class="subtitle">You make my heart skip a beat every single day. I can't imagine this Valentine's Day without you by my side.</p>
            
            <div class="buttons">
                <button class="yes-btn" onclick="sayYes()">
                    <span style="position: relative; z-index: 1;">Yes! 💕</span>
                </button>
                <button class="no-btn" id="noBtn">
                    No 😢
                </button>
            </div>
        </div>

        <div class="success" id="success">
            <div class="emoji">🎉</div>
            <h2>Yay! You Said Yes!</h2>
            <p>You just made me the happiest person alive! Can't wait to spend this Valentine's Day with you! 💕✨</p>
        </div>
    </div>

    <script>
        // Create floating hearts background
        function createFloatingHearts() {
            const container = document.getElementById('heartsContainer');
            const hearts = ['💕', '💖', '💗', '💓', '💝', '💘', '❤️', '🌹'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart-float';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 4 + 6) + 's';
                heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                heart.style.animationDelay = Math.random() * 2 + 's';
                
                container.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 10000);
            }, 800);
        }

        // Make the NO button run away
        const noBtn = document.getElementById('noBtn');
        let noBtnClickCount = 0;
        let lastMoveTime = 0;
        let isFirstMove = true;

        function moveNoButton() {
            // Prevent too frequent moves
            const now = Date.now();
            if (now - lastMoveTime < 100) return;
            lastMoveTime = now;

            // On first move, change to absolute positioning
            if (isFirstMove) {
                const btnRect = noBtn.getBoundingClientRect();
                const containerRect = noBtn.parentElement.getBoundingClientRect();
                
                // Calculate current position relative to container
                const currentLeft = btnRect.left - containerRect.left;
                const currentTop = btnRect.top - containerRect.top;
                
                // Add moving class and set initial position
                noBtn.classList.add('moving');
                noBtn.style.left = currentLeft + 'px';
                noBtn.style.top = currentTop + 'px';
                
                isFirstMove = false;
                
                // Wait a tiny bit before actually moving
                setTimeout(() => moveNoButton(), 50);
                return;
            }

            const container = noBtn.parentElement;
            const containerRect = container.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            
            // Get available space with more padding for mobile
            const padding = 10;
            const maxX = containerRect.width - btnRect.width - padding * 2;
            const maxY = containerRect.height - btnRect.height - padding * 2;
            
            // Generate random position
            let newX = Math.random() * maxX + padding;
            let newY = Math.random() * maxY + padding;
            
            // Get current position
            const currentX = parseFloat(noBtn.style.left) || 0;
            const currentY = parseFloat(noBtn.style.top) || 0;
            
            const distance = Math.sqrt(Math.pow(newX - currentX, 2) + Math.pow(newY - currentY, 2));
            
            // If too close, push it to opposite side
            if (distance < 120) {
                newX = currentX > containerRect.width / 2 ? padding : maxX;
                newY = currentY > containerRect.height / 2 ? padding : maxY;
            }
            
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            
            // Increase size of YES button on each attempt
            noBtnClickCount++;
            const yesBtn = document.querySelector('.yes-btn');
            const newScale = 1 + (noBtnClickCount * 0.08);
            yesBtn.style.transform = `scale(${newScale})`;
        }

        // Move button on hover (desktop)
        noBtn.addEventListener('mouseenter', moveNoButton);
        
        // Move button on click attempt
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // Better touch support for mobile
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            moveNoButton();
        }, { passive: false });

        // Also move on touchmove for when user tries to drag
        noBtn.addEventListener('touchmove', (e) => {
            e.preventDefault();
            moveNoButton();
        }, { passive: false });

        // Say yes function
        function sayYes() {
            // Create fireworks
            createFireworks();
            
            // Hide question, show success
            document.getElementById('question').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            
            // Change background to more vibrant
            document.body.style.background = 'linear-gradient(135deg, #ffd1dc 0%, #ffb3d9 50%, #ff9ecd 100%)';
        }

        // Fireworks effect
        function createFireworks() {
            const colors = ['#ff6b9d', '#ffd700', '#ff1493', '#ff69b4', '#ff85c1'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.background = colors[Math.floor(Math.random() * colors.length)];
                    firework.style.left = Math.random() * window.innerWidth + 'px';
                    firework.style.top = Math.random() * window.innerHeight + 'px';
                    
                    document.body.appendChild(firework);
                    
                    const angle = Math.random() * Math.PI * 2;
                    const velocity = Math.random() * 200 + 100;
                    const vx = Math.cos(angle) * velocity;
                    const vy = Math.sin(angle) * velocity;
                    
                    let x = parseFloat(firework.style.left);
                    let y = parseFloat(firework.style.top);
                    let opacity = 1;
                    
                    const animate = () => {
                        x += vx * 0.02;
                        y += vy * 0.02;
                        opacity -= 0.02;
                        
                        firework.style.left = x + 'px';
                        firework.style.top = y + 'px';
                        firework.style.opacity = opacity;
                        
                        if (opacity > 0) {
                            requestAnimationFrame(animate);
                        } else {
                            firework.remove();
                        }
                    };
                    
                    animate();
                }, i * 30);
            }
        }

        // Initialize floating hearts
        createFloatingHearts();
    </script>
</body>
</html>
